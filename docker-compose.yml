services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dado_home
      POSTGRES_USER: dado
      POSTGRES_PASSWORD: dado_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dado_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dado -d dado_home"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dado_pgdata:
